<style>
:root{--gold:#c9963f;--gold-d:#8a5d1c;--gold-l:#f6e9c8;--ink:#2a1a10;--mut:#7a6a58;--line:#e3d8c6;--bg:#f6f1ea;--card:#fcfaf6;--paper:#fff;--cell:#555;--th:#f1ebdd;--ok:#2f7a3e;--bad:#b3261e;--pink:#c2185b;--inp:#fff}
[data-theme=dark]{--gold:#d9a441;--gold-d:#f1c96a;--gold-l:#3a2f1c;--ink:#efe8db;--mut:#a89f90;--line:#3b362e;--bg:#15130f;--card:#1f1c17;--paper:#1f1c17;--cell:#8a8273;--th:#2c271f;--ok:#6cc483;--bad:#f08a80;--pink:#f48fb1;--inp:#1f1c17}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Noto Kufi Arabic','Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.5}
header{background:#1f1b16;color:#fff;padding:8px 10px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:7}
header h1{margin:0;font-size:20px;color:#f1c96a}
header p{margin:2px 0 0;font-size:13px;color:#d9cfbb}
.tog{display:flex;gap:6px;flex:0 0 auto}
.tog button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;padding:5px 9px;font-size:13px}
nav{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:10px}
button.pri{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
button.on{background:var(--gold-l);border-color:var(--gold);font-weight:700}
button.dng{color:var(--bad)}
main{max-width:760px;margin:0 auto;padding:12px 12px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px;color:var(--gold-d)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--inp);color:var(--ink)}
input:focus{outline:2px solid var(--gold);outline-offset:0}
[data-theme=dark] input[type=date]{color-scheme:dark}
.num{direction:ltr}
.big{font-size:18px;font-weight:700}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:6;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
.bar .fin{flex:1;min-width:0}
.bar .fin small{display:block;color:var(--mut);font-size:11px}
.bar .fin b{font-size:18px;direction:ltr;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat small{color:var(--mut);font-size:12px}
.stat b{display:block;font-size:17px;direction:ltr;text-align:end}
.inv{cursor:pointer}
.inv .h{display:flex;justify-content:space-between;align-items:center}
.inv .no{color:var(--gold-d);font-weight:700;direction:ltr}
.m{color:var(--mut);font-size:13px}
.inv .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.note{background:#fff4e0;color:#1f1b16;border:1px solid #f0d49a;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.note.ok{background:#e6f4ea;border-color:#b5dcbf}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
textarea{width:100%;min-height:150px;font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--inp);color:var(--ink)}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.ph{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:8px}
.ph h2{margin:0;font-size:22px}.ph div{font-size:13px;font-weight:700}
.fn{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.fn .t{font-weight:700;font-size:18px}.fn .n{color:var(--pink);font-weight:700;direction:ltr;white-space:nowrap}
.fn .n input{width:90px;display:inline;border:0;border-bottom:1px dotted var(--pink);border-radius:0;color:var(--pink);font-weight:700;padding:2px;background:transparent}
.ln{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:inherit;color:inherit}
.ln span{white-space:nowrap;font-size:13px;font-weight:600}
.ln input{border:0;border-bottom:1px dotted var(--cell);border-radius:0;padding:3px 4px;background:transparent;flex:1;min-width:0}
.ln input[type=date]{max-width:150px}
.pg{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
@media(min-width:720px){.pg{grid-template-columns:1.25fr 1fr}main{max-width:980px}}
table.pt{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:10px}
.pt th,.pt td{border:1px solid var(--cell);padding:0;text-align:center;font-size:13px}
.pt th{background:var(--th);padding:5px 2px;font-weight:700}
.pt td input{border:0;border-radius:0;padding:7px 3px;text-align:center;width:100%;background:transparent}
.pt td input.nm{text-align:start;padding-inline-start:6px}
.pt td.v{padding:7px 3px;font-weight:700;direction:ltr}
.pt tr.tot td{background:var(--gold-l);font-weight:700}
.pt caption{font-weight:700;padding:4px;caption-side:top}
.fab{position:fixed;left:16px;bottom:16px;width:58px;height:58px;border-radius:50%;background:var(--gold);border:0;color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:8;padding:0;transition:bottom .2s}
body.formv .fab{bottom:84px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:640px;max-height:85vh;border-radius:16px 16px 0 0;padding:14px;display:flex;flex-direction:column;gap:8px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.sheet .hd b{font-size:17px}
#nList{overflow:auto;flex:1;min-height:80px}
.nt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--bg)}
.nt .top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.nt .top b{color:var(--gold-d)}
.nt p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.nt button{padding:2px 8px;font-size:12px}
#nText{min-height:80px}
.badge{background:var(--bad);color:#fff;border-radius:6px;padding:0 6px;font-size:11px;white-space:nowrap;display:inline-block}
select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--inp);color:var(--ink)}

html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
.brand{display:flex;align-items:center;justify-content:center;gap:10px}
.logo{width:44px;height:44px;flex:0 0 auto}
.pt td.hl{outline:2px solid var(--gold);outline-offset:-2px;background:var(--gold-l)}
#printArea{display:none}
@media print{body>*{display:none!important}#printArea{display:block!important}#printArea img{width:100%;height:auto}@page{margin:8mm}}
.cust .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cust .nm{font-weight:700}
.ham{width:42px;height:42px;flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 10px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.ham span{display:block;height:2.5px;border-radius:2px;background:#f1c96a}
header .brand{flex:1;min-width:0;justify-content:flex-start;cursor:pointer}
header h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .logo{width:36px;height:36px}
.drawer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45)}
.drawer aside{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(300px,82vw);background:var(--card);box-shadow:0 0 24px rgba(0,0,0,.3);display:flex;flex-direction:column;padding:10px 0;overflow:auto;animation:slin .2s ease}
[dir=rtl] .drawer aside{animation-name:slinr}
@keyframes slin{from{transform:translateX(-100%)}to{transform:none}}@keyframes slinr{from{transform:translateX(100%)}to{transform:none}}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:6px 14px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.drawer .dh b{flex:1;color:var(--gold-d)}.drawer .dh .logo{width:40px;height:40px}.drawer .dh button{padding:4px 10px}
.drawer a{display:block;padding:14px 18px;font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer;border-inline-start:4px solid transparent}
.drawer a:hover{background:var(--gold-l)}.drawer a.on{background:var(--gold-l);border-inline-start-color:var(--gold);color:var(--gold-d)}
.drawer #hPh{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line)}
.hero{text-align:center;padding:26px 14px 22px;background:linear-gradient(160deg,#1f1b16,#3a2c14);color:#fff;border-radius:18px;margin-bottom:16px}
.hero img{width:84px;height:84px}.hero h2{font-size:24px;margin:8px 0 4px;color:#f1c96a}.hero p{margin:0 0 16px;color:#e6dcc8}
.hero .cta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.hero .cta button{min-width:140px}
.hero .cta button:not(.pri){background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.sec{margin:22px 0 10px;font-size:19px;color:var(--gold-d);text-align:center}
.sec+p.sub{text-align:center;color:var(--mut);margin:-4px 0 14px;font-size:14px}
.step{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;position:relative}
.step .n{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:17px}
.step h3{margin:2px 0 4px;font-size:16px}.step p{margin:0 0 6px;color:var(--mut);font-size:14px}
.step ul{margin:0 0 8px;padding-inline-start:18px;color:var(--mut);font-size:14px}
.step button{padding:6px 12px;font-size:14px}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.feat b{display:block;margin-bottom:2px}.feat span{color:var(--mut);font-size:13px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
details summary{font-weight:700;cursor:pointer}details p{margin:8px 0 0;color:var(--mut);font-size:14px}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:26px 0 10px}
/* ---- polish ---- */
:root{--sh:0 1px 2px rgba(31,27,22,.05),0 6px 18px rgba(31,27,22,.06);--r:16px}
[data-theme=dark]{--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
button{font-weight:600;min-height:42px;border-radius:12px;transition:background .15s,transform .08s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(180deg,#c08a2a,var(--gold));box-shadow:0 2px 8px rgba(168,116,26,.3)}
[data-theme=dark] button.pri{background:linear-gradient(180deg,#e2b04f,#b9852b);color:#1f1b16}
button.sm{min-height:36px;padding:6px 12px;font-size:14px}
button.dng{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.card{border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.phd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px}
.phd h2{margin:0;font-size:21px;color:var(--ink);display:flex;align-items:center;gap:8px}.phd h2 .i{color:var(--gold);width:24px;height:24px}.card h2{display:flex;align-items:center;gap:8px}
.stat{border-radius:14px;box-shadow:var(--sh);padding:12px;border-top:3px solid var(--line)}
.stat.acc{border-top-color:var(--ok)}.stat.gold{border-top-color:var(--gold)}.stat.warn{border-top-color:var(--bad)}
.stat b{font-size:18px}
.srch input{border-radius:14px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:8px}
.chk{display:flex;align-items:center;gap:8px;margin:0 2px 14px;font-size:14px;color:var(--ink)}
.chk input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--gold)}
.av{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f6d98a,var(--gold));color:#1f1b16;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:17px}
.av.lg{width:60px;height:60px;font-size:26px}
.inv .who{display:flex;align-items:center;gap:10px;margin:8px 0}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border-radius:12px;padding:8px}
.mets small{display:block;color:var(--mut);font-size:11px}.mets b{font-size:15px;direction:ltr;display:block;text-align:start}
.inv .acts{margin-top:10px}
.cust{display:flex;align-items:center;gap:12px;cursor:pointer}
.cust .cb{flex:1;min-width:0}.cust .nm{font-weight:700;font-size:16px}
.ibtn{position:relative;flex:0 0 auto;width:48px;height:48px;border-radius:14px;padding:0;font-size:22px;background:var(--gold-l);border-color:var(--gold)}
.ric{display:flex;gap:6px;align-items:center;flex:0 0 auto}.ibtn.sm2{width:38px;height:38px;min-height:38px;font-size:16px;background:var(--card);border-color:var(--line)}
.ibtn i{position:absolute;bottom:-4px;inset-inline-end:-4px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#fff;font-style:normal;font-size:15px;line-height:20px;font-weight:700}
.prof .ptop{display:flex;align-items:center;gap:14px}.prof h2{margin:0;font-size:20px;color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.kv:last-child{border:0}.kv span{color:var(--mut)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}.hrow:last-child{border:0}
.hrow:active{background:var(--gold-l)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{min-height:36px;padding:6px 14px;border-radius:999px;font-size:14px;white-space:nowrap;flex:0 0 auto}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
table.tt{width:100%;border-collapse:collapse;font-size:14px}.tt td{padding:7px 4px;border-bottom:1px solid var(--line)}.tt td.v{text-align:end;direction:ltr;font-weight:700;white-space:nowrap}
.tt tr.hd td{color:var(--mut);font-size:12px}.tt tr.tot td{border:0;font-weight:700}
.barx{display:block;height:8px;background:var(--bg);border-radius:6px;overflow:hidden;min-width:60px}.barx i{display:block;height:100%;background:linear-gradient(90deg,#e2b04f,var(--gold));border-radius:6px}
td.v .barx{margin-top:4px}
.drawer a{border-radius:0 12px 12px 0}[dir=rtl] .drawer a{border-radius:12px 0 0 12px}
.bar button{min-height:44px}

.i{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
button{display:inline-flex;align-items:center;justify-content:center;gap:7px}

.ham,.fab{display:none!important}

header{background:linear-gradient(135deg,#3b2a1d,#24170f);padding:10px 14px;gap:10px;box-shadow:0 4px 14px rgba(36,23,15,.25)}

.hb{width:40px;padding:0;color:#e8cc78}

<script>
/* ===== Standalone mode: local database (IndexedDB) + sharing, no server ===== */
window.__local=true;
(function(){
  const DBN='mill-invoices-db',ST='docs';let mem={};const subs=new Set();
  let dbp=null;const idb=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  let useLS=false;
  async function load(){try{const d=await idb();mem=await new Promise((res,rej)=>{const o={},c=d.transaction(ST).objectStore(ST).openCursor();c.onsuccess=()=>{const k=c.result;if(k){o[k.key]=k.value;k.continue()}else res(o)};c.onerror=()=>rej(c.error)})}
    catch(e){useLS=true;try{mem=JSON.parse(localStorage.getItem('mill-store')||'{}')}catch(_){mem={}}}}
  let q=Promise.resolve();
  function persist(ops){return q=q.then(async()=>{if(useLS){try{localStorage.setItem('mill-store',JSON.stringify(mem))}catch(_){}return}
    try{const d=await idb();await new Promise((res,rej)=>{const tx=d.transaction(ST,'readwrite'),os=tx.objectStore(ST);
      ops.forEach(([k,v])=>{if(k==='*clear')os.clear();else if(v===undefined)os.delete(k);else os.put(v,k)});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}})}
  let pend=new Set(),tmr=null;
  const notify=(path)=>{pend.add(path||'*');clearTimeout(tmr);tmr=setTimeout(()=>{const ps=[...pend];pend=new Set();subs.forEach(s=>{if(ps.includes('*')||ps.some(p=>s.match(p)))try{s.f()}catch(e){}})},0)};
  const meta={fromCache:false,hasPendingWrites:false};
  const snapDoc=p=>{const d=mem[p];return{id:p.split('/').pop(),exists:!!d,data:()=>d,metadata:meta}};
  const sub=(match,f)=>{const o={match,f};subs.add(o);setTimeout(f,0);return()=>subs.delete(o)};
  function coll(cp,ord,lim){const depth=cp.split('/').length+1;const qq={path:cp,
    doc(id){return docRef(cp+'/'+(id||(Date.now().toString(36)+Math.random().toString(36).slice(2,8))))},
    orderBy(f,d){return coll(cp,[f,d||'asc'],lim)},limit(n){return coll(cp,ord,n)},where(){return qq},
    async add(data){const r=qq.doc();await r.set(data);return r},
    async get(){return run()},
    onSnapshot(next){return sub(p=>p.startsWith(cp+'/')&&p.split('/').length===depth,()=>next(run()))}};
    function run(){let docs=Object.keys(mem).filter(k=>k.startsWith(cp+'/')&&k.split('/').length===depth).map(snapDoc);
      if(ord)docs.sort((a,b)=>{const x=a.data()[ord[0]],y=b.data()[ord[0]];return(x>y?1:x<y?-1:0)*(ord[1]==='desc'?-1:1)});
      if(lim)docs=docs.slice(0,lim);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta}}
    return qq}
  function docRef(p){return{id:p.split('/').pop(),path:p,async get(){return snapDoc(p)},
    async set(d){mem[p]=JSON.parse(JSON.stringify(d));notify(p);window.__onWrite&&window.__onWrite(p,mem[p]);await persist([[p,mem[p]]])},
    async update(d){mem[p]={...(mem[p]||{}),...JSON.parse(JSON.stringify(d))};notify(p);window.__onWrite&&window.__onWrite(p,mem[p]);await persist([[p,mem[p]]])},
    async delete(){delete mem[p];notify(p);window.__onWrite&&window.__onWrite(p,null);await persist([[p,undefined]])},
    onSnapshot(next){return sub(x=>x===p,()=>next(snapDoc(p)))},
    collection(c){return coll(p+'/'+c)}}}
  const DB={doc:docRef,collection:c=>coll(c)};
  const ready=load();

  /* share / save: preview sheet with buttons (share needs a direct tap) */
  function saveFile(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
  const DL={save({filename,data}){return new Promise((resolve,reject)=>{
    const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.json')?'application/json':'text/plain'});
    const file=new File([blob],filename,{type:blob.type||(filename.endsWith('.png')?'image/png':'application/octet-stream')});
    const isImg=/\.png$/i.test(filename);const ar=document.documentElement.lang!=='fr';
    const w=document.createElement('div');w.className='sheet';
    const url=URL.createObjectURL(blob);
    w.innerHTML=`<div>${isImg?`<img src="${url}" style="max-height:55vh;object-fit:contain;border:1px solid var(--line);border-radius:8px">`:`<div style="padding:10px 0;font-weight:700">${filename}</div>`}
      <button class="pri" data-a="share">${ar?'مشاركة (واتساب…)':'Partager (WhatsApp…)'}</button>
      <button data-a="save">${ar?'حفظ على الجهاز':'Enregistrer sur l\'appareil'}</button>
      <button data-a="close">${ar?'إغلاق':'Fermer'}</button></div>`;
    const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
    if(!canShare)w.querySelector('[data-a=share]').remove();
    const done=(ok)=>{w.remove();URL.revokeObjectURL(url);ok?resolve({status:'saved'}):reject({code:'declined'})};
    w.addEventListener('click',async e=>{const a=e.target.dataset.a||(e.target===w?'close':null);if(!a)return;
      if(a==='close')return done(false);

    async applyDelta(changed,keep){await ready;const ops=[];
      if(keep){const ks=new Set(keep);Object.keys(mem).forEach(k=>{if(!ks.has(k)){delete mem[k];ops.push([k,undefined])}})}
      Object.entries(changed||{}).forEach(([k,v])=>{mem[k]=JSON.parse(JSON.stringify(v));ops.push([k,mem[k]])});
      if(ops.length){await persist(ops);notify()}},

// المسدَّد من التكاليف: الفواتير القديمة بلا paidAmt (paid=true يعني سُدِّدت التكاليف كلها)
function payAmt(i,ct){return i.paidAmt==null?(i.paid?ct:0):num(i.paidAmt)}
// أرقام لوحة الرئيسية: ربح المطحنة = التكاليف المفوترة − مصاريف المطحنة، والمتبقي من التكاليف فقط (لا علاقة له بصافي الزبون)
function dashStats(invs,exTotal){
  let billed=0,paid=0,remaining=0,unpaidCount=0;
  invs.forEach(i=>{const ct=i.costsTotal||0,p=payAmt(i,ct),r=Math.max(ct-p,0);billed+=ct;paid+=p;remaining+=r;if(r>0)unpaidCount++});
  return {billed,paid,remaining,unpaidCount,profit:billed-(exTotal||0)};
}
const remOf=i=>{const ct=i.costsTotal||0;return Math.max(ct-payAmt(i,ct),0)};
// تقرير الفترة: المداخيل = التكاليف المفوترة، والصافي = المداخيل − مصاريف المطحنة في الفترة
function reportStats(list,exTotal){
  let sales=0,income=0;
  list.forEach(i=>{sales+=i.goldTotal||0;income+=i.costsTotal||0});
  return {sales,income,expenses:exTotal||0,net:income-(exTotal||0)};
}
// يبني كائن الإعدادات من الحقول والقوائم (يُختبر): الاسم مطلوب، والأسطر الفارغة تُحذف
function buildSettings(S0,fields,costs,parts){
  const n={...S0};
  Object.keys(fields).forEach(k=>n[k]=k==='startNo'?num(fields[k]):String(fields[k]).trim());
  n.costList=costs.map(x=>String(x).trim()).filter(Boolean);
  n.partList=parts.map(p=>({name:String(p.name).trim(),pct:String(p.pct||'').trim()})).filter(p=>p.name);
  return {n,err:n.name?null:'name'};
}
// سلسلة الرسم لكل يوم/شهر: المبيعات والتكاليف المفوترة والصافي (= التكاليف − مصاريف الفترة نفسها)
function repSeries(list,exps,byDay,a,b){
  const key=d=>byDay?String(d||'').slice(5,10):String(d||'').slice(0,7);
  const ser={},get=k=>ser[k]||(ser[k]={net:0,sales:0,cost:0});
  list.forEach(i=>{const k=key(i.date);if(!k)return;const o=get(k);o.sales+=i.goldTotal||0;o.cost+=i.costsTotal||0;o.net+=i.costsTotal||0});
  (exps||[]).forEach(e=>{const d=e.date||'';if(d<a||d>b)return;const k=key(d);if(!k)return;get(k).net-=num(e.amount)});
  return ser;
}
function calc(i){
  i.costs=i.costs||[];i.pcts=i.pcts||[];
  const rows=i.costs.map(c=>(c.qty===''?1:num(c.qty))*num(c.unit));
  const costsTotal=rows.reduce((a,b)=>a+b,0);
  const gold=num(i.grams)*num(i.gramPrice);
  const net=gold-costsTotal;
  const recov=num(i.tons)>0?num(i.grams)/num(i.tons):0;
  const paid=payAmt(i,costsTotal),remaining=Math.max(costsTotal-paid,0);
  return {rows,costsTotal,gold,net,recov,paid,remaining,amts:i.pcts.map(p=>net*num(p.pct)/100),pctSum:i.pcts.reduce((a,p)=>a+num(p.pct),0)};
}

let dirty=null;
const markDirty=(v,save,msgId)=>{dirty={v,save,msgId}};
const clearDirty=()=>{dirty=null};
function guardLeave(next){
  if(!dirty||dirty.v!==view){next();return}
  const w=document.createElement('div');w.className='sheet';
  w.innerHTML=`<div><div class="hd"><b>${esc(t('unsavedQ'))}</b></div>
    <div class="esrow"><button class="pri" data-s>${ic('check')}<span>${esc(t('okSave'))}</span></button><button class="dng" data-d>${esc(t('discard'))}</button></div>
    <button data-k>${esc(t('stay'))}</button></div>`;
  document.body.appendChild(w);
  w.addEventListener('click',async e=>{
    if(e.target===w||e.target.closest('[data-k]')){w.remove();return}
    if(e.target.closest('[data-d]')){w.remove();clearDirty();next();return}
    if(e.target.closest('[data-s]')){const d=dirty,ok=await d.save();w.remove();
      if(ok){clearDirty();next()}else{const m=d.msgId&&document.getElementById(d.msgId);if(m)m.scrollIntoView({block:'center'})}}
  });
}

function cleanNumInput(x){

  if(!ok)return;
  const v=x.value;let n=v.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[,،\s]/g,'').replace(/٫/g,'.').replace(/[^0-9.]/g,'');
  const i=n.indexOf('.');if(i!==-1)n=n.slice(0,i+1)+n.slice(i+1).replace(/\./g,'');

// كل فاتورة تحفظ في داخلها سجلاً بما تغيّر ومتى (آخر 40 تغييراً)، ويُزامَن معها
const HF=[['no','h_no'],['date','h_date'],['client','h_client'],['phone','h_phone'],['regNo','h_regNo'],['regDate','h_regDate'],['listNo','h_listNo'],['listDate','h_listDate'],
  ['serial','h_serial'],['bags','h_bags'],['tons','h_tons'],['grams','h_grams'],['gramPrice','h_gramPrice'],['buyer','h_buyer'],['receiptNo','h_receiptNo'],['invNote','h_invNote'],
  ['paidAmt','h_paidAmt'],['paid','h_paid'],['costsTotal','h_costsTotal'],['net','h_net']];
const fmtDT=ms=>{try{return new Date(ms).toLocaleString(lang==='fr'?'fr-FR':'ar-u-nu-latn',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
function histDiff(o,n){const ch=[];
  HF.forEach(([k])=>{let a=o[k],b=n[k];if(k==='costsTotal'||k==='net'){a=Math.round((+a||0)*100)/100;b=Math.round((+b||0)*100)/100}
    if(k==='paid'){a=!!a;b=!!b}if(k==='paidAmt'){a=o.paidAmt==null?(o.paid?(+o.costsTotal||0):0):num(o.paidAmt);b=num(n.paidAmt)}if(String(a??'')!==String(b??''))ch.push([k,a??'',b??''])});
  const sc=x=>JSON.stringify((x||[]).map(r=>[itm(r.name),String(r.qty??''),String(r.unit??'')]));
  if(sc(o.costs)!==sc(n.costs)&&!ch.some(c=>c[0]==='costsTotal'))ch.push(['costs','','']);
  const sp=x=>JSON.stringify((x||[]).map(r=>[itm(r.name),String(r.pct??'')]));
  if(sp(o.pcts)!==sp(n.pcts))ch.push(['pcts','','']);
  return ch}
function histAdd(h,e){return [...(Array.isArray(h)?h:[]),e].slice(-40)}
function histVal(k,v){if(k==='paid')return t(v?'h_yes':'h_noo');if(k==='costsTotal'||k==='net'||k==='paidAmt')return fmt(+v||0);return String(v===''||v==null?'—':v)}
function histHtml(inv){const h=Array.isArray(inv.history)?inv.history:[];if(!h.length)return '';
  const ar=lang==='ar'?'←':'→';
  const row=e=>{let tx='';
    if(e.a==='new')tx=t('h_new');else if(e.a==='cancel')tx=t('h_cancel');else if(e.a==='restore')tx=t('h_restore');
    else tx=(e.c||[]).map(([k,a,b])=>k==='costs'||k==='pcts'?esc(t('h_'+k)):`${esc(t((HF.find(x=>x[0]===k)||[k,'h_'+k])[1]))}: <bdi>${esc(histVal(k,a))}</bdi> ${ar} <bdi>${esc(histVal(k,b))}</bdi>`).join('<br>');
    if(e.a!=='edit')tx=esc(tx);
    return `<div class="hr"><small>${esc(fmtDT(e.at))}</small>${tx}</div>`};
  return `<details class="hist"><summary>${ic('history')}<span>${esc(t('h_title'))} (${h.length})</span></summary>${h.slice().reverse().map(row).join('')}</details>`}
async function setCancelled(no,on){const i=allInvoices.find(x=>x.no===no);if(!i)return;
  const d=JSON.parse(JSON.stringify(i));
  if(on)d.cancelled={at:Date.now()};else delete d.cancelled;
  d.history=histAdd(d.history,{at:Date.now(),a:on?'cancel':'restore'});
  try{await db.collection('invoices').doc(pad(no)).set(d)}catch(err){note('delErr')}}
function msg(h){$('#msg').innerHTML=h}
function note(k){noteKey=k||'';$('#notice').innerHTML=k?`<div class="note">${t(k)}</div>`:''}
let saving=false;
$('#btnSave').onclick=async()=>{if(saving)return;saving=true;try{await doSave()}finally{saving=false}};
async function saveFormStay(){if(saving)return false;saving=true;try{return await doSave(true)}finally{saving=false}}
async function doSave(stay){
  if(!db){msg(`<div class="note">${tI('noDb')}</div>`);return false}
  if(cur.cancelled){msg(`<div class="note">${esc(t('restoreFirst'))}</div>`);return false}
  if(!cur.no||cur.no<1){msg(`<div class="note">${tI('noNo')}</div>`);return false}
  if(!Number.isInteger(cur.no)){msg(`<div class="note">${tI('badNo')}</div>`);return false}
  if((!editing||cur.no!==origNo)&&allInvoices.some(i=>i.no===cur.no)){msg(`<div class="note">${tI('dupNo')}</div>`);return false}
  if(num(cur.grams)>0&&!num(cur.gramPrice)){msg(`<div class="note">${tI('needPrice')}</div>`);const g=$('[data-f=gramPrice]');g.focus();g.scrollIntoView({block:'center'});return false}
  if(!editing||cur.no!==origNo){try{const ex=await db.collection('invoices').doc(pad(cur.no)).get();if(ex.exists){msg(`<div class="note">${tI('dupNo')}</div>`);return false}}catch(e){}}
  try{await linkCustomer()}catch(e){}
  const c=calc(cur);
  const data={...cur,client:String(cur.client||'').trim(),phone:String(cur.phone||'').trim(),goldTotal:c.gold,costsTotal:c.costsTotal,net:c.net,paidAmt:c.paid,paid:c.remaining<=0,updatedAt:Date.now()};
  const orig=editing?allInvoices.find(i=>i.no===origNo):null;
  if(!orig)data.history=histAdd(cur.history,{at:Date.now(),a:'new'});
  else{const ch=histDiff(orig,data);if(ch.length)data.history=histAdd(orig.history,{at:Date.now(),a:'edit',c:ch});else data.history=orig.history||[]}
  try{
    await db.collection('invoices').doc(pad(cur.no)).set(data);
    if(origNo&&origNo!==cur.no){try{await db.collection('invoices').doc(pad(origNo)).delete()}catch(e){}}
    origNo=cur.no;
    editing=true;
    msg(`<div class="note ok">${tI('saved')}</div>`);clearDirty();
    if(stay)return true;
    setTimeout(()=>{const pc=cur.custId&&profKey&&clients().find(x=>x.id===cur.custId);if(pc&&pc.key===profKey){openProf(profKey)}else{renderList();show('list')}},700);
    return true;
  }catch(err){msg(`<div class="note">${tI('saveErr')} (${esc(err&&err.code||'')})</div>`);return false}
}
function summary(){
  const c=calc(cur);
  const o=[S.name,t('invoice')+' N° '+pad(cur.no)+' — '+cur.date,t('client2')+': '+cur.client+(cur.phone?' ('+cur.phone+')':''),'',t('costs')+':'];
  cur.costs.forEach((x,i)=>{if(c.rows[i])o.push('- '+itm(x.name)+': '+fmt(c.rows[i]))});
  o.push(t('costsTotal')+': '+fmt(c.costsTotal),'',t('gold')+': '+fmt(num(cur.grams))+' '+t('g')+' × '+fmt(num(cur.gramPrice))+' = '+fmt(c.gold),t('net')+': '+fmt(c.net)+' '+cur$());
  if(c.recov)o.push(t('recov')+': '+fmt(c.recov)+' '+t('gpt'));
  if(cur.buyer||cur.receiptNo)o.push(t('buyer')+': '+(cur.buyer||'—')+' · '+t('receipt')+': '+(cur.receiptNo||'—'));
  if(cur.invNote)o.push(t('invNote')+': '+cur.invNote);
  const ps=cur.pcts.map((p,i)=>num(p.pct)?'- '+itm(p.name)+' ('+p.pct+'%): '+fmt(c.amts[i]):'').filter(Boolean);
  if(ps.length)o.push('',t('pcts')+':',...ps);
  return o.join('\n');
}

async function persistSettings(){
  readSetLists();
  const f={};document.querySelectorAll('[data-s]').forEach(i=>f[i.dataset.s]=i.value);
  const {n,err}=buildSettings(S,f,setCosts,setParts);
  if(err)return t('noNameErr');
  if(!db)return t('noDb');
  try{await db.doc('settings/main').set(n);S=n;applyChrome()}catch(e){return t('setErr')}
  return null;
}
let setStT=null,setDeb=null;
function setStatus(err){
  const h=err?`<div class="note">${esc(err)}</div>`:`<div class="note ok">${tI('setSaved')}</div>`;
  ['#setStat','#setMsg'].forEach(q=>{const x=$(q);if(x)x.innerHTML=h});
  clearTimeout(setStT);if(!err)setStT=setTimeout(()=>['#setStat','#setMsg'].forEach(q=>{const x=$(q);if(x)x.innerHTML=''}),2500);
}
$('#vSet').addEventListener('change',async e=>{if(e.target.dataset&&e.target.dataset.s){clearTimeout(setDeb);setStatus(await persistSettings())}});

const iso=v=>/^[\d\s.\-\/+]+$/.test(String(v))?'\u2066'+v+'\u2069':String(v);
async function drawInvoice(i){
  const c=calc(i), W=1080, P=40, F="'Cairo','Noto Kufi Arabic','Noto Sans Arabic','Segoe UI',Tahoma,sans-serif", rtl=lang==='ar', rowH=54;
  const cv=document.createElement('canvas'), x=cv.getContext('2d');
  cv.width=W;cv.height=470+(i.costs.length+i.pcts.length+11)*rowH+200;
  x.fillStyle='#fff';x.fillRect(0,0,W,cv.height);x.textBaseline='middle';
  const T=(s,px,py,o={})=>{x.font=`${o.b?700:400} ${o.s||24}px ${F}`;x.fillStyle=o.c||'#1f1b16';x.textAlign=o.a||'start';x.direction=o.ltr?'ltr':(rtl?'rtl':'ltr');x.fillText(String(s??''),px,py)};
  const S0=rtl?W-P:P, E0=rtl?P:W-P;
  try{const im=new Image();im.src=LOGO;await im.decode();x.drawImage(im,W/2-34,8,68,68)}catch(e){}
  T(S.name,W/2,108,{s:44,b:1,a:'center'});
  if(S.ph1||S.ph2)T(t('phone')+': '+[S.ph1,S.ph2].filter(Boolean).map(iso).join(' - '),W/2,156,{s:24,b:1,a:'center'});
  x.fillStyle='#1f1b16';x.fillRect(P,184,W-2*P,3);
  T(t('invoice'),S0,224,{s:30,b:1});
  T('Facture N° '+pad(i.no),E0,224,{s:28,b:1,a:rtl?'left':'right',c:'#c2185b',ltr:1});
  let y=274;
  const pair=(l1,v1,l2,v2)=>{T(t(l1)+': '+(v1?iso(v1):'—'),S0,y,{s:23});T(t(l2)+': '+(v2?iso(v2):'—'),W/2+(rtl?-10:10),y,{s:23});y+=42};
  pair('date',i.date,'serial',i.serial);
  pair('client',i.client,'cphone',i.phone);
  pair('reg',i.regNo,'regDate',i.regDate);
  pair('listNo',i.listNo,'listDate',i.listDate);
  pair('bags',i.bags,'tons',i.tons);
  pair('buyer',i.buyer,'receipt',i.receiptNo);
  y+=10;
  const table=(title,cols,rows,foot)=>{
    if(title){T(title,W/2,y+20,{s:26,b:1,a:'center'});y+=46}
    const tw=W-2*P, ws=cols.map(k=>k.w*tw);
    const line=(cells,bg,bold)=>{let cx=rtl?W-P:P;cells.forEach((s,k)=>{const w=ws[k],l=rtl?cx-w:cx;if(bg){x.fillStyle=bg;x.fillRect(l,y,w,rowH)}x.strokeStyle='#555';x.lineWidth=1.5;x.strokeRect(l,y,w,rowH);T(s,l+w/2,y+rowH/2,{s:23,b:bold,a:'center'});cx+=rtl?-w:w});y+=rowH};
    line(cols.map(k=>k.h),'#f1ebdd',1);rows.forEach(r=>line(r));if(foot)line(foot,'#f6ecd6',1);y+=18;
  };
  const f0=v=>v?fmt(v):'';
  table(null,[{w:.4,h:t('name')},{w:.15,h:t('qty')},{w:.2,h:t('unit')},{w:.25,h:t('total')}],
    i.costs.map((r,k)=>[itm(r.name),r.qty,f0(num(r.unit)),f0(c.rows[k])]),[t('costsTotal'),'','',fmt(c.costsTotal)]);
  table(t('goldSale'),[{w:.25,h:t('grams')},{w:.25,h:t('gPrice')},{w:.25,h:t('gTotal')},{w:.25,h:t('recov')+' '+t('gpt')}],[[f0(num(i.grams)),f0(num(i.gramPrice)),fmt(c.gold),c.recov?fmt(c.recov):'']]);
  table(null,[{w:1/3,h:t('general')},{w:1/3,h:t('costsTotal')},{w:1/3,h:t('net')+' ('+cur$()+')'}],[[fmt(c.gold),fmt(c.costsTotal),fmt(c.net)]]);
  table(t('pcts'),[{w:.45,h:t('name')},{w:.2,h:'%'},{w:.35,h:t('amount')}],
    i.pcts.map((p,k)=>[itm(p.name),p.pct?p.pct+'%':'',num(p.pct)?fmt(c.amts[k]):'']),[t('sum'),fmt(c.pctSum)+'%','']);
  if(i.invNote){T(t('invNote')+': '+i.invNote,S0,y+14,{s:23});y+=44}
  T(c.remaining<=0?t('paid')+' ✓':t('unpaid')+(c.paid>0?' — '+t('paidAmt')+' '+fmt(c.paid)+' · '+t('remain')+' '+fmt(c.remaining):''),S0,y+14,{s:23,b:1,c:c.remaining<=0?'#2f7a3e':'#b3261e'});y+=44;
  const out=document.createElement('canvas');out.width=W;out.height=y+30;
  const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,W,out.height);o.drawImage(cv,0,0);
  return out;
}
async function shareImage(i,say){
  try{
    const cv=await drawInvoice(i);
    if(!dl){say(t('imgHold')+'<img src="'+cv.toDataURL('image/png')+'" style="width:100%;border:1px solid #ccc;margin-top:6px">');return}
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    await dl.save({filename:t('file')+'-'+pad(i.no)+'.png',data:blob});
    say(t('imgOk'));
  }catch(err){
    if(err&&err.code==='declined')return;
    say(t('imgErr')+' ('+esc(err&&err.code||'')+')');
  }
}

const digits=v=>String(v||'').replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/\D/g,'');
const ckey=(name,phone)=>digits(phone)?'p'+digits(phone):'n'+String(name||'').trim();
const initial=n=>(String(n||'').trim()[0]||'?').toUpperCase();
const BASIC=['regNo','regDate','listNo','serial'];
function clients(){
  const m=new Map(), byId={};
  customers.forEach(c=>{const o={...c,key:ckey(c.name,c.phone),saved:true,invs:[],count:0,grams:0,gold:0,costs:0,net:0,unpaid:0,unpaidAmt:0,last:''};if(!m.has(o.key))m.set(o.key,o);byId[c.id]=o});
  [...invoices].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||a.no-b.no).forEach(i=>{
    const name=String(i.client||'').trim(), ph=digits(i.phone);
    if(!name&&!ph&&!i.custId)return;
    let c=(i.custId&&byId[i.custId])||m.get(ckey(name,i.phone));
    if(!c&&!ph&&name){c=[...m.values()].find(x=>x.name===name)}
    if(!c){c={key:ckey(name,i.phone),id:null,saved:false,name:'',phone:'',invs:[],count:0,grams:0,gold:0,costs:0,net:0,unpaid:0,unpaidAmt:0,last:''};m.set(c.key,c)}
    if(!c.saved){if(name)c.name=name;if(i.phone)c.phone=String(i.phone).trim();BASIC.forEach(k=>{if(i[k])c[k]=i[k]})}
    c.invs.push(i);c.count++;c.grams+=num(i.grams);c.gold+=i.goldTotal||0;c.costs+=i.costsTotal||0;c.net+=i.net||0;
    {const r=remOf(i);if(r>0){c.unpaid++;c.unpaidAmt+=r}}c.last=i.date||c.last;
  });
  return [...m.values()].sort((a,b)=>String(b.last).localeCompare(String(a.last))||String(a.name).localeCompare(String(b.name)));
}
function fillCust(c){

async function linkCustomer(){

  let c=(cur.custId&&customers.find(x=>x.id===cur.custId))||customers.find(x=>ckey(x.name,x.phone)===ckey(name,phone))||(!digits(phone)&&customers.find(x=>x.name===name))||customers.find(x=>!digits(x.phone)&&x.name===name);
  if(!c){const id=newCid();const d={id,name,phone,createdAt:Date.now()};BASIC.forEach(k=>{if(cur[k])d[k]=cur[k]});
    await db.collection('customers').doc(id).set(d);customers=[...customers,d];cur.custId=id;return}
  cur.custId=c.id;
  const up={};if(!c.phone&&phone)up.phone=phone;BASIC.forEach(k=>{if(!c[k]&&cur[k])up[k]=cur[k]});

/* ---------- monthly report ---------- */
function period(){
  const d=new Date(),y=d.getFullYear(),mo=d.getMonth();
  const ym=(Y,M)=>{const x=new Date(Y,M,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
  if(repP==='month')return[ym(y,mo)+'-01',ym(y,mo)+'-31'];
  if(repP==='last')return[ym(y,mo-1)+'-01',ym(y,mo-1)+'-31'];
  if(repP==='year')return[y+'-01-01',y+'-12-31'];
  if(repP==='custom')return[repFrom||'0000',repTo||'9999'];
  return['0000','9999'];
}
function chart(rows,cols){
  const W=320,H=150,P=6,n=rows.length,g=rows[0][1].length;const mx=Math.max(1,...rows.flatMap(r=>r[1].map(Math.abs)));const hasNeg=rows.some(r=>r[1].some(v=>v<0));
  const base=hasNeg?H/2:H-18,sc=(hasNeg?H/2-10:H-28)/mx,bw=(W-2*P)/n,iw=Math.max(3,Math.min(18,(bw-6)/g));
  let o=`<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="none">`;
  [0.25,0.5,0.75,1].forEach(f=>{const y=base-mx*f*sc;o+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="gl"/>`});
  o+=`<line x1="0" x2="${W}" y1="${base}" y2="${base}" class="bl"/>`;
  rows.forEach((r,i)=>{const cx=P+bw*i+bw/2;r[1].forEach((v,j)=>{const h=Math.abs(v)*sc,x=cx-(g*iw)/2+j*iw,y=v>=0?base-h:base;o+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(iw-1.5).toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2" fill="${v<0?'#c0553f':cols[j]}"/>`});
    if(n<=14&&(n<=7||i%2===0))o+=`<text x="${cx}" y="${H-3}" text-anchor="middle">${esc(r[0].replace(/^\d{4}-/,''))}</text>`});
  return o+'</svg>';
}
const bar=(v,max,neg)=>`<span class="barx"><i style="width:${max>0?Math.max(2,Math.round(Math.abs(v)/max*100)):0}%;${neg?'background:var(--bad)':''}"></i></span>`;
function openRep(){
  const[a,b]=period();
  const list=invoices.filter(i=>{const d=i.date||'';return d>=a&&d<=b});
  const sum=f=>list.reduce((x,i)=>x+f(i),0);
  const grams=sum(i=>num(i.grams)),tons=sum(i=>num(i.tons)),sales=sum(i=>i.goldTotal||0),costs=sum(i=>i.costsTotal||0);
  const RS=reportStats(list,exSum(a,b).total);
  const unp=list.filter(i=>remOf(i)>0);
  const items={},sh={},months={},cs={};
  list.forEach(i=>{const c=calc(i);

  ${K2(t('aMills'),o.mills,'users')}${K2(t('aActive7'),o.active7,'trend')}${K2(t('aSusp'),o.suspended,'x',o.suspended?'warn':'')}${K2(t('aFreeCodes'),o.codes_free,'shield')}
  ${K2(t('aOpenMsgs'),o.msgs_open,'pen',o.msgs_open?'warn':'')}${K2(t('aPendPays'),o.pay_pending,'coins',o.pay_pending?'warn':'')}${K2(t('aPaidSum'),fmt(+o.pay_confirmed_sum),'receipt','acc')}${K2(t('aInvoices'),o.invoices,'invoice')}${K2(t('aGrams'),fmt(+o.grams)+' '+t('g'),'gem','gold')}</div>
  <h3 style="margin:14px 4px 6px">${t('subL')}</h3><div class="stats">${K2(t('aSubExp'),o.sub_expired,'x',o.sub_expired?'warn':'')}${K2(t('aSubSoon'),o.sub_soon,'coins',o.sub_soon?'warn':'')}${K2(t('aSetupDue'),o.setup_due,'receipt',o.setup_due?'warn':'')}${K2(t('subNone'),o.sub_none,'shield')}</div>`}
let admShow=60;
function admAccounts(){const q=admQ.trim(),all=(admCache.acc||[]).filter(a=>!q||String(a.mill_name).includes(q)||String(a.phone).includes(digits(q)||q)),list=all.slice(0,admShow);
  $('#admBody').innerHTML=`<div class="srch">${ic('search')}<input id="aq" type="search" placeholder="${t('searchAcc')}" value="${esc(admQ)}"></div>
   ${list.map(a=>`<div class="card cust" data-acc="${a.id}"><span class="av">${esc(initial(a.mill_name))}</span><div class="cb"><div class="nm">${esc(a.mill_name)} ${a.role==='admin'?pill(t('roleAdmin'),'adm'):''}${a.status!=='active'?pill(t('aSusp'),'rejected'):''} ${a.role==='mill'?subPill(a):''}</div>
    <div class="m" dir="ltr" style="text-align:start">${esc(a.phone)}</div><div class="m">${a.invoices} ${t('invCount')} · ${t('lastSeen')}: ${fmtD(a.last_sync||a.last_login)}${a.msgs_open?` · ${pill(a.msgs_open+' ✉','open')}`:''}${a.pay_pending?` · ${pill(a.pay_pending+' 💳','pending')}`:''}</div></div></div>`).join('')||`<div class="empty">—</div>`}
   ${all.length>list.length?`<button id="aMore" style="width:100%;margin-top:6px">${esc(t('showMore'))} (${all.length-list.length})</button>`:''}`;
  const mb=$('#aMore');if(mb)mb.onclick=()=>{admShow+=100;admAccounts()};
  const i=$('#aq');let tm;i.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{admQ=i.value;admShow=60;const p=i.selectionStart;admAccounts();const n=$('#aq');n.focus();try{n.setSelectionRange(p,p)}catch(e){}},250)};
  $('#admBody').querySelectorAll('[data-acc]').forEach(c=>c.onclick=()=>{admAcct=c.dataset.acc;openAdmin('acct')});
}
function admDetail(d){const me=d.me,docs=d.docs||{},invs=Object.entries(docs).filter(([k])=>k.startsWith('invoices/')).map(([,v])=>v).filter(v=>!v.cancelled).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||b.no-a.no);
  const ncust=Object.keys(docs).filter(k=>k.startsWith('customers/')).length,net=invs.reduce((x,i)=>x+(+i.net||0),0),grams=invs.reduce((x,i)=>x+num(i.grams),0),paid=(d.payments||[]).filter(p=>p.status==='confirmed').reduce((x,p)=>x+(+p.amount),0);
  const kv=(l,v,ltr)=>`<div class="kv"><span>${l}</span><b ${ltr?'dir="ltr"':''}>${v}</b></div>`;
  $('#admBody').innerHTML=`<button class="sm" data-at2="acc" style="margin-bottom:10px">${ic('back','flip')}<span>${t('back')}</span></button>
   <div class="card prof"><div class="ptop"><span class="av lg">${esc(initial(me.mill_name))}</span><div style="flex:1;min-width:0"><h2>${esc(me.mill_name)}</h2><div class="m" dir="ltr" style="text-align:start">${esc(me.phone)}${me.phone2?' · '+esc(me.phone2):''}</div>
    <div>${pill(me.role==='admin'?t('roleAdmin'):t('roleMill'),'adm')} ${me.status!=='active'?pill(t('aSusp'),'rejected'):pill('✓','confirmed')}</div></div></div></div>
   <div class="stats">${K2(t('aInvoices'),invs.length,'invoice')}${K2(t('kCust'),ncust,'users')}${K2(t('aGrams'),fmt(grams),'gem','gold')}${K2(t('kNet'),fmt(net),'trend','acc')}${K2(t('paidAmt'),fmt(paid),'coins')}</div>
   ${me.role!=='admin'?subCard(me)+`<div class="card"><h2>${t('subEdit')}</h2><div class="grid"><div class="full"><label>${t('paidUntilL')}</label><input id="dSu" type="date" dir="ltr" value="${me.paid_until||''}"></div>
    <div><label>${t('setupL')}</label><input id="dSf" class="num" inputmode="numeric" value="${+me.setup_fee||0}"></div><div><label>${t('monthlyL')}</label><input id="dMf" class="num" inputmode="numeric" value="${+me.monthly_fee||0}"></div></div>
    <button class="pri" id="dSub" style="width:100%;margin-top:10px">${ic('save')}<span>${t('saveSub')}</span></button><div id="dSMsg"></div></div>`:''}
   <div class="card"><h2>${t('acctInfo')}</h2>${kv(t('created'),fmtD(me.created_at))}${kv(t('lastLogin'),fmtD(me.last_login))}${kv(t('lastSync'),fmtD(me.last_sync))}${kv(t('codeUsed'),esc(me.code_used||'—'),1)}
    ${me.role!=='admin'?`<div class="alist" style="margin-top:10px"><button id="dSt" class="${me.status==='active'?'dng':'pri'}">${me.status==='active'?t('suspend'):t('activate')}</button>
     <input id="dPw" type="text" placeholder="${t('newPass')} (6+)" autocomplete="off"><button id="dPwGo">${ic('shield')}<span>${t('resetPwd')}</span></button></div>`:''}<div id="dMsg"></div></div>
   ${me.role!=='admin'?`<div class="card"><h2>${t('addPayAdm')}</h2><div class="grid"><div><label>${t('kindL')}</label>${kindSel('dKind','monthly')}</div><div><label>${t('amountL')} (MRU)</label><input id="dAmt" class="num" inputmode="decimal" value="${kindAmt('monthly',me)}"></div><div><label>${t('periodL')}</label><input id="dPer"></div>
    <div><label>${t('methodL')}</label><input id="dMet"></div><div><label>${t('refL')}</label><input id="dRef" dir="ltr"></div></div><button class="pri" id="dPay" style="width:100%;margin-top:10px">${ic('plus')}<span>${t('addPayAdm')}</span></button></div>`:''}
   <div class="card"><h2>${t('recentInv')} (${invs.length})</h2>${invs.slice(0,30).map(i=>`<div class="hrow" style="cursor:default"><div><b class="no">N° ${esc(pad(i.no))}</b> ${remOf(i)<=0?'':pill(t('unpaid'),'rejected')}<div class="m">${esc(i.client||'—')} · <bdi dir="ltr">${esc(i.date||'')}</bdi> · <bdi>${fmt(num(i.grams))}</bdi> ${t('g')}</div></div><b dir="ltr" class="${(+i.net||0)<0?'neg':'pos'}">${fmt(+i.net||0)}</b></div>`).join('')||'<div class="m">—</div>'}</div>
   <div class="card"><h2>${t('aMsgs')} (${(d.messages||[]).length})</h2>${(d.messages||[]).map(x=>`<div class="hrow" style="cursor:default;display:block"><div class="row1"><b>${esc(x.subject||x.kind)}</b>${pill(t('st_'+x.status),x.status)}</div><p class="pre">${esc(x.body)}</p></div>`).join('')||'<div class="m">—</div>'}</div>
   <div class="card"><h2>${t('aPays')} (${(d.payments||[]).length})</h2>${(d.payments||[]).map(payRow).join('')||'<div class="m">—</div>'}</div>`;
  $('#admBody').querySelector('[data-at2]').onclick=()=>openAdmin('acc');
  const st=$('#dSt');if(st)st.onclick=async()=>{try{await rpc('admin_set_status',{p_token:tok(),p_id:me.id,p_status:me.status==='active'?'suspended':'active'});openAdmin('acct')}catch(e){$('#dMsg').innerHTML=`<div class="note">${errT(e)}</div>`}};
  const pg=$('#dPwGo');if(pg)pg.onclick=async()=>{try{await rpc('admin_reset_password',{p_token:tok(),p_id:me.id,p_new:$('#dPw').value});$('#dMsg').innerHTML=`<div class="note ok">${t('resetDone')}</div>`}catch(e){$('#dMsg').innerHTML=`<div class="note">${errT(e)}</div>`}};
  const dk=$('#dKind');if(dk)dk.onchange=()=>{$('#dAmt').value=kindAmt(dk.value,me)};
  const ds=$('#dSub');if(ds)ds.onclick=async()=>{try{await rpc('admin_set_sub',{p_token:tok(),p_id:me.id,p_paid_until:$('#dSu').value||null,p_setup_fee:num($('#dSf').value),p_monthly_fee:num($('#dMf').value)});openAdmin('acct')}catch(e){$('#dSMsg').innerHTML=`<div class="note">${errT(e)}</div>`}};
  const dp=$('#dPay');if(dp)dp.onclick=async()=>{const a=num($('#dAmt').value);if(!(a>0))return;try{await rpc('admin_add_payment',{p_token:tok(),p_id:me.id,p_amount:a,p_method:$('#dMet').value,p_reference:$('#dRef').value,p_period:$('#dPer').value,p_note:'',p_kind:$('#dKind').value});openAdmin('acct')}catch(e){$('#dMsg').innerHTML=`<div class="note">${errT(e)}</div>`}};
}
async function copyTxt(txt,btn){try{await navigator.clipboard.writeText(txt);if(btn){const o=btn.innerHTML;btn.innerHTML=`<span>${t('copied2')}</span>`;setTimeout(()=>btn.innerHTML=o,1500)}}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}}
function admCodes(list,fresh){
  $('#admBody').innerHTML=`<div class="card"><h2>${t('genCodes')}</h2><div class="grid"><div><label>${t('countL')}</label><input id="gN" class="num" inputmode="numeric" value="1"></div><div><label>${t('daysL')}</label><input id="gD" class="num" inputmode="numeric" value="30"></div>
    <div class="full"><label>${t('noteL')}</label><input id="gNote"></div></div><button class="pri" id="gGo" style="width:100%;margin-top:10px">${ic('shield')}<span>${t('generate')}</span></button>
    ${fresh&&fresh.length?`<div class="fresh">${fresh.map(c=>`<div class="lrow"><b class="codev" dir="ltr">${c}</b><button class="sm" data-cp="${c}">${ic('copy')}<span>${t('copy2')}</span></button></div>`).join('')}${fresh.length>1?`<button class="sm" data-cpall="1" style="width:100%">${ic('copy')}<span>${t('copy2')} (${fresh.length})</span></button>`:''}</div>`:''}<div id="gMsg"></div></div>
   ${list.map(c=>`<div class="card"><div class="row1"><b class="codev" dir="ltr">${esc(c.code)}</b>${pill(t('cs_'+c.state),c.state)}</div>
    <div class="m">${c.note?esc(c.note)+' · ':''}${t('created')}: ${fmtD(c.created_at)}${c.expires_at?' · '+t('expires')+': '+fmtD(c.expires_at):''}${c.used_by_name?` · ${t('usedBy')}: ${esc(c.used_by_name)} <bdi dir="ltr">${esc(c.used_by_phone||'')}</bdi>`:''}</div>
    ${c.state==='free'?`<div class="acts"><button class="sm" data-cp="${esc(c.code)}">${ic('copy')}<span>${t('copy2')}</span></button><button class="sm dng" data-rv="${esc(c.code)}">${ic('x')}<span>${t('revoke')}</span></button></div>`:''}</div>`).join('')}`;
  $('#gGo').onclick=async()=>{const b=$('#gGo');b.disabled=true;try{const r=await rpc('admin_gen_codes',{p_token:tok(),p_count:Math.max(1,Math.min(50,num($('#gN').value)||1)),p_note:$('#gNote').value,p_days:num($('#gD').value)||0});
      admCodes(await rpc('admin_codes',{p_token:tok()})||[],r)}catch(e){b.disabled=false;$('#gMsg').innerHTML=`<div class="note">${errT(e)}</div>`}};
  $('#admBody').querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>copyTxt(t('shareCodeMsg')+' '+b.dataset.cp,b));
  const ca=$('#admBody').querySelector('[data-cpall]');if(ca)ca.onclick=()=>copyTxt(fresh.join('\n'),ca);
  $('#admBody').querySelectorAll('[data-rv]').forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.querySelector('span').textContent=t('sure');return}try{await rpc('admin_revoke_code',{p_token:tok(),p_code:b.dataset.rv});openAdmin('codes')}catch(e){}});
}
function admMsgs(){const list=(admCache.msgs||[]).filter(m=>admMsgF==='all'||m.status==='open');
  $('#admBody').innerHTML=`<div class="seg" style="margin-bottom:12px"><button data-f="open" class="${admMsgF==='open'?'on':''}">${t('openF')}</button><button data-f="all" class="${admMsgF==='all'?'on':''}">${t('allF')}</button></div>
   ${list.map(m=>`<div class="card"><div class="row1"><b>${esc(m.mill_name)}</b>${pill(t('st_'+m.status),m.status)}</div><div class="m"><bdi dir="ltr">${esc(m.phone)}</bdi> · ${kindT(m.kind)} · ${fmtD(m.created_at)}</div>
    ${m.subject?`<b>${esc(m.subject)}</b>`:''}<p class="pre">${esc(m.body)}</p>${m.reply?`<div class="replyb"><b>${t('adminReply')}</b><p class="pre">${esc(m.reply)}</p></div>`:''}
    <textarea data-rt="${m.id}" rows="2" style="min-height:0" placeholder="${t('reply')}…">${esc(m.reply||'')}</textarea>
    <div class="acts"><button class="sm pri" data-rp="${m.id}">${ic('share')}<span>${t('reply')}</span></button>${m.status!=='closed'?`<button class="sm" data-cl="${m.id}">${ic('check')}<span>${t('close')}</span></button>`:''}</div></div>`).join('')||`<div class="empty">${t('noMsgs')}</div>`}`;
  $('#admBody').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{admMsgF=b.dataset.f;admMsgs()});
  const act=async(id,st)=>{const txt=$(`[data-rt="${id}"]`).value;try{await rpc('admin_reply',{p_token:tok(),p_id:+id,p_reply:txt,p_status:st});openAdmin('msgs')}catch(e){}};
  $('#admBody').querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>act(b.dataset.rp,'replied'));
  $('#admBody').querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>act(b.dataset.cl,'closed'));
}
function admPays(){const list=(admCache.pays||[]).filter(p=>admPayF==='all'||p.status==='pending');
  $('#admBody').innerHTML=`<div class="seg" style="margin-bottom:12px"><button data-f="pending" class="${admPayF==='pending'?'on':''}">${t('pendF')}</button><button data-f="all" class="${admPayF==='all'?'on':''}">${t('allF')}</button></div>
   ${list.map(p=>`<div class="card"><div class="row1"><b>${esc(p.mill_name)}</b>${pill(t('ps_'+p.status),p.status)}</div><div class="m"><bdi dir="ltr">${esc(p.phone)}</bdi> · ${fmtD(p.created_at)}</div>
    <div class="big" dir="ltr" style="text-align:start">${fmt(+p.amount)} <small>${esc(p.currency)}</small></div>
    <div class="m">${esc(['cash','bank','other'].includes(p.method)?t(p.method):p.method)}${p.reference?` · <bdi dir="ltr">${esc(p.reference)}</bdi>`:''}${p.period?` · ${esc(p.period)}`:''}</div>${p.note?`<p class="pre">${esc(p.note)}</p>`:''}
    ${p.status==='pending'?`<div class="acts"><button class="sm pri" data-ps="${p.id}" data-v="confirmed">${ic('check')}<span>${t('confirm')}</span></button><button class="sm dng" data-ps="${p.id}" data-v="rejected">${ic('x')}<span>${t('reject')}</span></button></div>`:''}</div>`).join('')||`<div class="empty">${t('noPays')}</div>`}`;
  $('#admBody').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{admPayF=b.dataset.f;admPays()});
  $('#admBody').querySelectorAll('[data-ps]').forEach(b=>b.onclick=async()=>{try{await rpc('admin_set_payment',{p_token:tok(),p_id:+b.dataset.ps,p_status:b.dataset.v});openAdmin('pays')}catch(e){}});
}

/* ---------- init ---------- */
applyChrome();renderList();openHome();
(async()=>{
  claude.use('downloads').then(d=>{dl=d}).catch(()=>{});
  try{db=await claude.use('db')}catch(e){db=null}
  if(!db){note('viewOnly');renderList();if(view==='home')openHome(true);return}
  db.collection('notes').orderBy('createdAt','asc').onSnapshot(sn=>{notes=sn.docs.map(d=>({id:d.id,...d.data()}));renderNotes()},()=>{});
  if(!sess){store.get('lang')?openWelcome('login'):openLangPick()}else{needSetup=false;try{const sd=await db.doc('settings/main').get();if(sd.exists){S={...S,...sd.data()};applyChrome()}}catch(e){}
    flush();pull();rpc('me',{p_token:tok()}).then(m=>{if(m){sess.me=m;saveSess(sess);applyChrome();if(view==='set')openSet(true);if(view==='home')openHome(true)}}).catch(()=>{});setTimeout(()=>{if(isAdmin()&&view==='home')openAdmin('ov')},50)}
  db.doc('settings/main').onSnapshot(d=>{if(d.exists){S={...S,...d.data()};needSetup=false;applyChrome()}},()=>{});
  db.collection('expenses').onSnapshot(sn=>{expenses=sn.docs.map(d=>({...d.data(),id:d.id}));if(view==='exp')openExp(true);else if(view==='rep')openRep();else if(view==='home')openHome(true)},()=>{});
  db.collection('customers').onSnapshot(sn=>{customers=sn.docs.map(d=>({...d.data(),id:d.id}));if(view==='cust'&&document.activeElement.id!=='cSearch')openCust();else if(view==='prof')openProf(profKey,true)},()=>{});
  const timer=setTimeout(()=>note('slow'),10000);
  db.collection('invoices').orderBy('no','desc').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);if(noteKey==='slow')note('')}
    // الفواتير الملغاة تبقى محفوظة وظاهرة في القائمة، لكنها لا تدخل في أي مجموع
    allInvoices=snap.docs.map(d=>d.data());invoices=allInvoices.filter(i=>!i.cancelled);loaded=true;
    if(window.__local&&!sess&&invoices.length&&!noteKey){const lb=window.__backup.last();if(!lb||Date.now()-new Date(lb)>7*864e5)note('backupDue')}if(view==='home')openHome(true);else if(view==='list')renderList();else if(view==='rep')openRep();else if(view==='cust'&&document.activeElement.id!=='cSearch')openCust();else if(view==='prof')openProf(profKey,true);
  },err=>{clearTimeout(timer);loaded=true;note('loadErr');renderList()});
})();
</script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
